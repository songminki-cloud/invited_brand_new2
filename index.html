<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXT BRANDS</title>
<meta name="description" content="아직 국내에 들어오지 않았거나 이제 막 알려지기 시작한 브랜드를 모았습니다. 테크·뷰티·리빙·스포츠·패션 5개 영역.">
<meta property="og:title" content="NEXT BRANDS">
<meta property="og:description" content="아직 국내에 들어오지 않았거나 이제 막 알려지기 시작한 브랜드를 모았습니다. 테크·뷰티·리빙·스포츠·패션 5개 영역.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* -- §6-1 tokens ----------------------------------------------- */
:root {
    --bg:     #FFFFFF;
    --fg:     #111111;
    --fg-sub: #767676;
    --line:   #E5E5E5;
    --accent: #1D4ED8;  /* 마켓레이더(무채색+그린/레드 시맨틱)와 분기: 딥 블루 1색 */
    --radius: 2px;
    /* §6-2 type scale: 4단계 고정 */
    --fs-title:   30px;
    --fs-section: 17px;
    --fs-body:    14px;
    --fs-meta:    12px;
    /* §6-3 spacing: 2단계 고정 */
    --sp-section: 48px;
    --sp-el:      16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { width: 100%; overflow-x: hidden; }

body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;
    font-size: var(--fs-body);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--fg); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
}

.site {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px;
}

.view { display: none; }
.view.active { display: block; }

/* -- EN caps treatment (마켓레이더 공유 스펙: 대문자 + 자간) -- */
.caps { text-transform: uppercase; letter-spacing: 0.08em; }

/* -- header --------------------------------------------------- */
.hero {
    padding: calc(var(--sp-section) / 2) 0;
    border-bottom: 2px solid var(--fg);
}
.hero-owner {
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--fg-sub);
    line-height: 1.4;
}
.hero-title {
    margin-top: var(--sp-el);
    font-size: var(--fs-title);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.4;
    text-transform: uppercase;
}
.hero-vol {
    margin-top: 4px;
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--fg-sub);
    line-height: 1.4;
}
.hero-intro {
    margin-top: var(--sp-el);
    max-width: 560px;
    font-size: var(--fs-body);
    color: var(--fg);
}
.hero-counter {
    margin-top: var(--sp-el);
    font-size: var(--fs-section);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
}
.hero-counter .num { color: var(--accent); }

/* sub-page header */
.subhead {
    padding: calc(var(--sp-section) / 2) 0 var(--sp-el);
    border-bottom: 1px solid var(--line);
    font-size: var(--fs-meta);
    font-weight: 700;
    color: var(--fg-sub);
    line-height: 1.4;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}
.subhead a { letter-spacing: 0.12em; }
.page-hero {
    padding: calc(var(--sp-section) / 2) 0;
    border-bottom: 2px solid var(--fg);
}
.page-title {
    font-size: var(--fs-title);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.4;
    text-transform: uppercase;
}
.page-sub {
    margin-top: 4px;
    font-size: var(--fs-body);
    color: var(--fg-sub);
}
.page-counter {
    margin-top: var(--sp-el);
    font-size: var(--fs-section);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
}
.page-counter .num { color: var(--accent); }

/* -- category list (index) ------------------------------------ */
.section-title {
    font-size: var(--fs-section);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    text-transform: uppercase;
    padding: calc(var(--sp-section) / 2) 0 var(--sp-el);
}
.cat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}
.cat-card {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 104px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    text-align: left;
}
.cat-label {
    font-size: var(--fs-section);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    text-transform: uppercase;
    overflow-wrap: anywhere;
}
.cat-sub {
    font-size: var(--fs-meta);
    color: var(--fg-sub);
    line-height: 1.4;
}
.cat-count {
    margin-top: auto;
    padding-top: 8px;
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    color: var(--accent);
}
.cat-card.muted .cat-label { color: var(--fg-sub); }
.cat-card.wide {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: baseline;
    gap: 8px;
    min-height: 0;
}
.cat-card.wide .cat-count { margin-top: 0; margin-left: auto; padding-top: 0; }
.cat-grid .ad-slot { grid-column: 1 / -1; margin: 0; }
.cat-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: var(--sp-el);
}
.chip {
    font-size: var(--fs-meta);
    line-height: 1.4;
    color: var(--fg-sub);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 3px 8px;
}

/* -- A–Z + search ---------------------------------------------- */
.az-search {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    font-size: var(--fs-body);
    margin-bottom: var(--sp-el);
}
.az-search::placeholder { color: var(--fg-sub); }
.az-search:focus { outline: none; border-color: var(--accent); }
#azList {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: var(--sp-el);
}
#azList .az-empty { grid-column: 1 / -1; }
.az-empty {
    padding: var(--sp-el) 0;
    color: var(--fg-sub);
    font-size: var(--fs-body);
}

/* -- brand list item: 단일 카드 템플릿 (§7-4) ------------------ */
.brand-item {
    padding: var(--sp-el) 0;
    border-bottom: 1px solid var(--line);
}
.brand-item.highlight { border-left: 2px solid var(--accent); padding-left: 14px; }
.brand-sig {
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    color: var(--fg-sub);
}
.brand-name {
    margin-top: 2px;
    font-size: var(--fs-section);
    font-weight: 700;
    line-height: 1.4;
}
.brand-headline {
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    color: var(--fg-sub);
    text-transform: uppercase;
}
.brand-def {
    margin-top: 6px;
    font-size: var(--fs-body);
    font-weight: 700;
}
.brand-desc {
    margin-top: 4px;
    font-size: var(--fs-body);
    color: var(--fg);
}
.brand-links {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-el);
    margin-top: 8px;
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
}
.brand-links a { color: var(--fg-sub); text-transform: uppercase; }
.brand-links button {
    color: var(--fg-sub);
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0;
}
.brand-links button.saved { color: var(--accent); }

/* A–Z compact row: 같은 템플릿의 축약 표시 */
.az-item {
    cursor: pointer;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: var(--fs-body);
    line-height: 1.4;
    overflow-wrap: anywhere;
}
.az-item.favorited { color: var(--accent); font-weight: 700; }

/* -- ad slot: 자리만 확보 (§9) --------------------------------- */
.ad-slot {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--sp-el);
    margin: var(--sp-el) 0;
    font-size: var(--fs-meta);
    color: var(--fg-sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* -- footer --------------------------------------------------- */
.footer {
    margin-top: var(--sp-section);
    padding: var(--sp-el) 0 var(--sp-section);
    border-top: 1px solid var(--line);
    font-size: var(--fs-meta);
    line-height: 1.4;
    color: var(--fg-sub);
}
.footer p + p { margin-top: 6px; }
.footer .notice { margin-top: var(--sp-el); }

/* -- modal (관리자·제보 공용 골격) ----------------------------- */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17,17,17,0.5);
    z-index: 100;
    overflow-y: auto;
    padding: 20px;
}
.modal-overlay.active { display: block; }
.modal-box {
    max-width: 480px;
    margin: 40px auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--sp-el);
}
.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--sp-el);
}
.modal-title {
    font-size: var(--fs-section);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    text-transform: uppercase;
}
.modal-close-btn {
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--fg-sub);
}
.form-group { margin-bottom: var(--sp-el); }
.form-label {
    display: block;
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.4;
    color: var(--fg-sub);
    margin-bottom: 4px;
    text-transform: uppercase;
}
.form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    font-size: var(--fs-body);
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: var(--accent);
}
.form-textarea { min-height: 96px; resize: vertical; }
.form-hint {
    display: none;
    margin-top: 4px;
    font-size: var(--fs-meta);
    line-height: 1.4;
    color: var(--fg-sub);
}
.form-hint.visible { display: block; }
.btn {
    display: inline-block;
    padding: 10px 16px;
    border: 1px solid var(--fg);
    border-radius: var(--radius);
    background: var(--fg);
    color: var(--bg);
    font-size: var(--fs-body);
    font-weight: 700;
    letter-spacing: 0.08em;
}
.btn:disabled { background: var(--fg-sub); border-color: var(--fg-sub); cursor: default; }
.btn-line {
    background: var(--bg);
    color: var(--fg);
}
.status-line {
    margin-top: 8px;
    font-size: var(--fs-meta);
    line-height: 1.4;
    color: var(--fg-sub);
    min-height: 17px;
}
.provider-row { display: flex; gap: 6px; flex-wrap: wrap; }
.provider-opt {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--fg-sub);
}
.provider-opt.active { border-color: var(--accent); color: var(--accent); }

/* -- admin toolbar (isAdmin일 때만 JS로 주입) ------------------ */
.admin-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--fg);
    color: var(--bg);
    z-index: 90;
}
.admin-bar-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 8px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-el);
    align-items: center;
}
.admin-bar button {
    color: var(--bg);
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 0;
}
body.is-admin { padding-bottom: 56px; }

/* -- toast ---------------------------------------------------- */
.toast {
    position: fixed;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--fg);
    color: var(--bg);
    font-size: var(--fs-meta);
    letter-spacing: 0.04em;
    padding: 8px 16px;
    border-radius: var(--radius);
    z-index: 200;
    display: none;
    white-space: nowrap;
}
.toast.visible { display: block; }

/* -- 플로팅 퀵 내비게이션 (1px 라인 SVG 아이콘) -- */
.fab-nav {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 80;
}
body.is-admin .fab-nav { bottom: 64px; }
.fab-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--fg);
    border-radius: var(--radius);
    background: var(--fg);
    color: var(--bg);
}
.fab-menu {
    display: none;
    position: absolute;
    right: 0;
    bottom: 52px;
    min-width: 168px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
}
.fab-menu.active { display: block; }
.fab-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    font-size: var(--fs-body);
    line-height: 1.4;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
}
.fab-menu button:last-child { border-bottom: none; }
.fab-menu button.caps-item {
    font-size: var(--fs-meta);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* -- 호버는 마우스 환경에서만 (터치 잔상 방지) -- */
@media (hover: hover) and (pointer: fine) {
    a:hover { color: var(--accent); }
    .cat-card:hover { border-color: var(--accent); }
    .cat-card:hover .cat-label { color: var(--accent); }
    .chip:hover { color: var(--accent); border-color: var(--accent); }
    .az-item:hover { color: var(--accent); }
    .brand-links a:hover,
    .brand-links button:hover,
    .modal-close-btn:hover { color: var(--accent); }
    .btn:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn-line:hover { background: var(--bg); color: var(--accent); border-color: var(--accent); }
    .admin-bar button:hover { color: var(--line); }
    .fab-menu button:hover { color: var(--accent); }
}
</style>
</head>
<body>

<div class="site">

    <!-- INDEX -->
    <section id="view-index" class="view active">
        <header class="hero" id="siteHeader"></header>

        <h2 class="section-title">Categories</h2>
        <nav id="catList" aria-label="카테고리"></nav>

        <section aria-label="전체 브랜드">
            <h2 class="section-title">All Brands A&#8211;Z</h2>
            <input type="search" class="az-search" id="azSearch" placeholder="브랜드명, 정의, 국가로 검색" autocomplete="off" aria-label="브랜드 검색">
            <div id="azList"></div>
        </section>

        <footer class="footer" id="footerIndex"></footer>
    </section>

    <!-- CATEGORY / FAVORITES / ARCHIVE 뷰: 단일 컨테이너에 템플릿 렌더링 -->
    <section id="view-page" class="view"></section>

</div>

<div class="fab-nav" id="fabNav">
    <div class="fab-menu" id="fabMenu" role="menu"></div>
    <button type="button" class="fab-btn" id="fabBtn" aria-label="메뉴" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg>
    </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* === §2 SITE 상수 — 모든 이름 문자열의 단일 출처 =============== */
const SITE = {
    owner:    'M MALL',          // 퍼블릭 오픈 시 이 줄만 교체
    product:  'NEXT BRANDS',
    volume:   'VOL. 01',
    intro:    '아직 국내에 들어오지 않았거나 이제 막 알려지기 시작한 브랜드를 모았습니다. 어떤 브랜드인지, 지금 왜 눈에 띄는지 수시로 아카이빙합니다.',
    tagline:  '다음에 올 브랜드들',
    footerNote: '다음에 올 브랜드들의 기록',
    metaDescription: '아직 국내에 들어오지 않았거나 이제 막 알려지기 시작한 브랜드를 모았습니다. 테크·뷰티·리빙·스포츠·패션 5개 영역.',
    year:     '2026',
    isPublic: false,             // true 전환 시 광고 슬롯 + 비제휴 고지 + 제보 노출
    isAdmin:  false              // 관리자 도구 노출 여부 (§7) — URL ?admin=1 로도 진입
};
// 퍼블릭 전환 시: SITE.owner 교체 -> isPublic true -> og:image 교체
// -> 커스텀 도메인 연결 -> 저장소명 변경 -> favicon 교체
// 데이터 저장소 좌표 (GitHub 실명 - 저장소명 변경 시 여기만 교체)
const REPO = { owner: 'songminki-cloud', name: 'invited_brand_new2' };

/* === §3 카테고리 5종 (순서 고정) + 보류 그룹 ================== */
const CATEGORIES = [
    { key: 'tech',    label: 'TECH',    sub: '테크',            def: '기술을 취향의 영역으로 끌어온 브랜드들' },
    { key: 'beauty',  label: 'BEAUTY',  sub: '뷰티',            def: '성분과 감각으로 새로운 기준을 세우는 브랜드들' },
    { key: 'living',  label: 'LIVING',  sub: '리빙·라이프스타일', def: '공간과 사물의 밀도를 바꾸는 브랜드들' },
    { key: 'sports',  label: 'SPORTS',  sub: '스포츠·레저',      def: '퍼포먼스에서 시작해 일상으로 넘어온 브랜드들' },
    { key: 'fashion', label: 'FASHION', sub: '패션',            def: '옷과 액세서리로 태도를 만드는 브랜드들' }
];
const UNCLASSIFIED = { key: 'unclassified', label: 'UNCLASSIFIED', sub: '미분류', def: '분류 보류 — 편집 재검토 대기' };
const CAT_LABELS = {};
CATEGORIES.concat([UNCLASSIFIED]).forEach(function(c) { CAT_LABELS[c.key] = c; });

/* === localStorage: 구 키(mmall_*) -> 신 키(nextbrands_*) 이관 == */
const LS = {
    custom:    'nextbrands_custom_brands',
    hidden:    'nextbrands_hidden_brands',
    overrides: 'nextbrands_brand_overrides',
    favorites: 'nextbrands_favorites',
    provider:  'nextbrands_api_provider',
    keyAnthropic: 'nextbrands_api_key_anthropic',
    keyGoogle:    'nextbrands_api_key_google',
    keyOpenai:    'nextbrands_api_key_openai',
    keyBrave:     'nextbrands_brave_api_key',
    githubPat:    'nextbrands_github_pat',
    admin:        'nextbrands_admin',
    reports:      'nextbrands_report_queue'
};
(function migrateLegacyKeys() {
    const MAP = {
        mmall_custom_brands: LS.custom,
        mmall_hidden_brands: LS.hidden,
        mmall_brand_overrides: LS.overrides,
        mmall_favorites: LS.favorites,
        mmall_api_provider: LS.provider,
        mmall_api_key_anthropic: LS.keyAnthropic,
        mmall_api_key_google: LS.keyGoogle,
        mmall_api_key_openai: LS.keyOpenai,
        mmall_brave_api_key: LS.keyBrave,
        mmall_github_pat: LS.githubPat
    };
    let migrated = 0;
    Object.keys(MAP).forEach(function(oldKey) {
        try {
            const v = localStorage.getItem(oldKey);
            if (v !== null) {
                if (localStorage.getItem(MAP[oldKey]) === null) localStorage.setItem(MAP[oldKey], v);
                localStorage.removeItem(oldKey);
                migrated++;
            }
        } catch (e) { /* storage unavailable */ }
    });
    if (migrated > 0) console.info('[' + SITE.product + '] legacy localStorage keys migrated:', migrated);
})();

})();

/* 구 스키마 커스텀 레코드 정규화: 구 카테고리는 tags로 보존 */
const OLD_CATEGORY_LABELS = { concept: 'Concept', street: 'Street', heritage: 'Heritage', emerging: 'Emerging', select_shop: 'Select Shop' };
function normalizeCustomBrand(b) {
    const r = Object.assign({}, b);
    if (!Array.isArray(r.tags)) r.tags = [];
    const oldCat = r.archivedCategory || r.category;
    if (oldCat && OLD_CATEGORY_LABELS[oldCat]) {
        if (r.tags.indexOf(OLD_CATEGORY_LABELS[oldCat]) < 0) r.tags.push(OLD_CATEGORY_LABELS[oldCat]);
        r.category = 'unclassified';
    }
    if (!r.category || !CAT_LABELS[r.category]) r.category = 'unclassified';
    delete r.archivedCategory;
    if (!r.addedAt) r.addedAt = r.createdAt ? r.createdAt.slice(0, 7) : 'unknown';
    return r;
}
customBrands = customBrands.map(normalizeCustomBrand);

/* === 데이터 접근 ============================================== */
function applyOverrides(brand) {
    const ov = brandOverrides[brand.name];
    return ov ? Object.assign({}, brand, ov) : brand;
}
function allBrands() {
    const mainNames = new Set(mainBrands.map(function(b) { return b.name; }));
    const extras = customBrands.filter(function(b) { return !mainNames.has(b.name); });
    return mainBrands.concat(extras).filter(function(b) { return !hiddenBrands.has(b.name); });
}
function brandsInCategory(key) {
    return allBrands()
        .filter(function(b) { return (b.category || 'unclassified') === key; })
        .sort(function(a, b) {
            const na = applyOverrides(a).name, nb = applyOverrides(b).name;
            return na.localeCompare(nb, 'ko-KR');
        });
}
function brandByName(name) {
    return allBrands().find(function(b) { return b.name === name; }) ||
           customBrands.find(function(b) { return b.name === name; }) || null;
}
function recentBrands(key, n) {
    const list = allBrands().filter(function(b) { return (b.category || 'unclassified') === key; });
    const known = list.filter(function(b) { return b.addedAt && b.addedAt !== 'unknown'; })
        .sort(function(a, b) { return b.addedAt.localeCompare(a.addedAt); });
    const unknown = list.filter(function(b) { return !b.addedAt || b.addedAt === 'unknown'; }).reverse();
    return known.concat(unknown).slice(0, n);
}

/* === 렌더링 유틸 ============================================== */
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtAddedAt(v) {
    if (!v || v === 'unknown') return '';
    return v.replace('-', '.');
}
/* §6-4 시그니처: 국가 코드 + 등재 연월 */
function signature(b) {
    const parts = [];
    if (b.country) parts.push(esc(b.country));
    const d = fmtAddedAt(b.addedAt);
    if (d) parts.push(d);
    return parts.join(' &middot; ');
}

/* === 단일 브랜드 카드 템플릿 (§7-4: 렌더링은 이 함수 하나만) === */
function brandItemHTML(brand) {
    const b = applyOverrides(brand);
    const isFav = favorites.indexOf(brand.name) >= 0;
    let html = '<article class="brand-item" data-name="' + esc(brand.name) + '">';
    const sig = signature(b);
    if (sig) html += '<div class="brand-sig">' + sig + '</div>';
    html += '<h3 class="brand-name">' + esc(b.name) + '</h3>';
    if (b.headline) html += '<div class="brand-headline">' + esc(b.headline) + '</div>';
    if (b.definition) html += '<p class="brand-def">' + esc(b.definition) + '</p>';
    if (b.description) html += '<p class="brand-desc">' + esc(b.description) + '</p>';
    html += '<div class="brand-links">';
    if (b.homepage) html += '<a href="' + esc(b.homepage) + '" target="_blank" rel="noopener noreferrer">Homepage</a>';
    if (b.instagram && b.instagram !== b.homepage) html += '<a href="' + esc(b.instagram) + '" target="_blank" rel="noopener noreferrer">Instagram</a>';
    html += '<button type="button" data-action="fav" class="' + (isFav ? 'saved' : '') + '">' + (isFav ? 'Saved' : 'Save') + '</button>';
    if (isAdmin) html += '<button type="button" data-action="edit">Edit</button>';
    html += '</div></article>';
    return html;
}

/* A–Z 행: 브랜드명만 2열 콤팩트 표기 */
function azItemHTML(brand) {
    const b = applyOverrides(brand);

    return '<div class="az-item' + (isFav ? ' favorited' : '') + '" data-name="' + esc(brand.name) + '" role="link" tabindex="0">' +

/* === A–Z 리스트 + 검색 (§6-6) ================================= */
function renderAZ(query) {
    const list = document.getElementById('azList');
    const q = (query || '').trim().toLowerCase();
    const sorted = allBrands().slice().sort(function(a, b) {
        return applyOverrides(a).name.localeCompare(applyOverrides(b).name, 'ko-KR');
    });
    const filtered = !q ? sorted : sorted.filter(function(brand) {
        const b = applyOverrides(brand);
        return [b.name, brand.name, b.headline, b.definition, b.country, (b.tags || []).join(' ')]
            .join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (filtered.length === 0) {
        list.innerHTML = '<p class="az-empty">검색 결과가 없습니다.</p>';
        return;
    }
    list.innerHTML = filtered.map(azItemHTML).join('');
}

function showView(name, arg) {
    currentView = { name: name, arg: arg };
    const idx = document.getElementById('view-index');
    const page = document.getElementById('view-page');
    if (name === 'index') {
        renderIndex();
        idx.classList.add('active');
        page.classList.remove('active');
    } else {
        if (name === 'category') renderCategoryView(arg);
        else if (name === 'favorites') renderFavoritesView();
        else if (name === 'archive') renderArchiveView();
        idx.classList.remove('active');
        page.classList.add('active');
    }
    window.scrollTo(0, 0);
}
function rerenderCurrentView() { showView(currentView.name, currentView.arg); }

function goToBrand(name) {
    const b = brandByName(name);
    if (!b) return;
    const key = b.category || 'unclassified';
    const isCustomOnly = !mainBrands.some(function(m) { return m.name === name; }) && isAdmin &&
                         customBrands.some(function(m) { return m.name === name; }) &&
                         !allBrands().some(function(m) { return m.name === name; });
    showView(isCustomOnly ? 'archive' : 'category', key);
    requestAnimationFrame(function() {
        const el = document.querySelector('#view-page .brand-item[data-name="' + CSS.escape(name) + '"]');
        if (el) {
            const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
            el.classList.add('highlight');
            setTimeout(function() { el.classList.remove('highlight'); }, 2000);
        }
    });
}

/* === Favorites ================================================ */
function toggleFavorite(name) {
    const i = favorites.indexOf(name);
    if (i >= 0) favorites.splice(i, 1);
    else favorites.push(name);
    saveFavorites();
    rerenderCurrentView();
}
function shareFavorites() {
    if (favorites.length === 0) { showToast('저장한 브랜드가 없습니다.'); return; }
    const now = new Date();
    const pad = function(n) { return String(n).padStart(2, '0'); };
    let text = SITE.product + '\nMy Favorites\n\n총 ' + favorites.length + '개 브랜드\n\n';
    favorites.forEach(function(name, i) { text += (i + 1) + '. ' + name + '\n'; });
    text += '\n' + now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate());
    if (navigator.share) {
        navigator.share({ title: SITE.product + ' - My Favorites', text: text }).catch(function(err) {
            if (err && err.name !== 'AbortError') copyText(text);
        });
    } else { copyText(text); }
}
function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { showToast('목록이 복사되었습니다.'); })
            .catch(function() { copyTextFallback(text); });
    } else { copyTextFallback(text); }
}
function copyTextFallback(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('목록이 복사되었습니다.'); }
    catch (e) { showToast('복사에 실패했습니다.'); }
    document.body.removeChild(ta);
}

}

function submitReport() {
    const name = document.getElementById('reportName').value.trim();
    const link = document.getElementById('reportLink').value.trim();

    if (!name) { document.getElementById('reportStatus').textContent = '브랜드명을 입력해 주세요.'; return; }
    const queue = JSON.parse(localStorage.getItem(LS.reports) || '[]');
    queue.push({ name: name, link: link, reason: reason, reportedAt: new Date().toISOString() });
    localStorage.setItem(LS.reports, JSON.stringify(queue));  // 관리자 검토 큐 — 즉시 반영하지 않음
    document.getElementById('reportName').value = '';
    document.getElementById('reportLink').value = '';
    document.getElementById('reportReason').value = '';
    document.getElementById('reportStatus').textContent = '제보해 주셔서 감사합니다. 검토 후 등재됩니다.';
}

            opts = opts || {};

                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,

                    messages: [{ role: 'user', content: prompt }]
                })
            });
            if (!res.ok) {
                const e = await res.json().catch(function() { return {}; });
                throw new Error((e.error && e.error.message) ? e.error.message : 'HTTP ' + res.status);
            }
            const data = await res.json();
            return data.content[0].text;
        }
    },

    },

/* -- AI 생성 파이프라인 -- */
function extractBrandJSON(text) {
    if (!text) return null;
    const cleaned = text.replace(/```(?:json)?[\s\S]*?```/g, function(m) {
        return m.replace(/```(?:json)?/g, '').replace(/```/g, '');
    }).trim();
    try { return JSON.parse(cleaned); } catch (e) {}
    let s = cleaned.indexOf('{'), en = cleaned.lastIndexOf('}');
    if (s !== -1 && en > s) { try { return JSON.parse(cleaned.slice(s, en + 1)); } catch (e) {} }
    s = text.indexOf('{'); en = text.lastIndexOf('}');
    if (s !== -1 && en > s) { try { return JSON.parse(text.slice(s, en + 1)); } catch (e) {} }
    return null;
}
function extractSearchTerm(desc) {
    const first = desc.split('\n')[0].trim();
    const parts = first.split(/[,;]/);
    let name = parts[0].trim();
    if (parts.length > 1) {
        const alt = parts[1].trim();
        if (alt.length > 0 && alt.length < 40) name = (name + ' ' + alt).trim();
    }
    return name.slice(0, 80) || desc.slice(0, 60);
}
function extractLatinWords(text) {
    return text.toLowerCase().split(/[\s,().\-\/]+/)
        .filter(function(w) { return w.length > 1 && /[a-z]/.test(w); });
}
function isRelevantMatch(shortQuery, officialName) {
    if (!officialName) return false;
    const latin = extractLatinWords(shortQuery);
    if (latin.length === 0) return true;
    const nameLower = officialName.toLowerCase();
    return latin.every(function(w) { return nameLower.indexOf(w) >= 0; });
}
function isWebResultRelevant(shortQuery, webResult) {
    if (!webResult) return false;
    const latin = extractLatinWords(shortQuery);
    if (latin.length === 0) return true;
    const hay = ((webResult.title || '') + ' ' + (webResult.extract || '').slice(0, 400)).toLowerCase();
    return latin.every(function(w) { return hay.indexOf(w) >= 0; });
}
async function identifyBrand(provider, apiKey, shortQuery, country) {
    const prompt =
        '당신은 브랜드 식별 전문가입니다. 아래 브랜드명을 보고 실제 존재하는 브랜드인지 판단해주세요.\n\n' +
        '브랜드명: "' + shortQuery + '"\n' +
        (country ? '국가 힌트: ' + country + '\n' : '') + '\n' +
        '중요 규칙 (반드시 준수):\n' +
        '1. 이 브랜드명이 실존하는 브랜드라는 근거가 조금이라도 있으면 found: true.\n' +
        '2. 비슷한 이름의 완전히 다른 사람/브랜드로 대체하는 것은 절대 금지. 모르면 found: false.\n' +
        '3. officialName은 반드시 입력 브랜드명과 동일하거나 그 공식 전체 명칭이어야 함.\n' +
        '4. confidence: 0-100. 브랜드 존재가 확실하지 않으면 50 미만으로.\n\n' +
        '순수 JSON으로만 응답:\n' +
        '{"found": false, "confidence": 0, "officialName": "", "country": ""}';
    const content = await provider.call(apiKey, prompt, { temperature: 0, maxTokens: 256 });
    return extractBrandJSON(content) || { found: false, confidence: 0 };
}
async function searchBraveForBrand(shortQuery) {
    const braveKey = localStorage.getItem(LS.keyBrave);
    if (!braveKey) return null;
    const latinPart = extractLatinWords(shortQuery).join(' ');
    const queries = [shortQuery];
    if (latinPart && latinPart !== shortQuery.toLowerCase().trim()) queries.push(latinPart);
    queries.push((latinPart || shortQuery) + ' brand');
    for (let qi = 0; qi < queries.length; qi++) {
        try {
            const res = await fetch(
                'https://api.search.brave.com/res/v1/web/search?q=' + encodeURIComponent(queries[qi]) + '&count=5',
                { headers: { 'Accept': 'application/json', 'X-Subscription-Token': braveKey } }
            );
            if (!res.ok) continue;
            const data = await res.json();
            const results = data.web && data.web.results;
            if (!results || results.length === 0) continue;
            const extract = results.slice(0, 4).map(function(r) {
                return '[' + r.title + '] ' + (r.description || '');
            }).join('\n');
            const candidate = { title: results[0].title, extract: extract, source: 'Brave Search' };
            if (isWebResultRelevant(shortQuery, candidate)) return candidate;
        } catch (e) { break; } // CORS 실패 가능 — Wikipedia/AI로 폴백
    }
    return null;
}
async function searchWikipediaForBrand(shortQuery) {
    const langs = ['en', 'ko'];
    for (let li = 0; li < langs.length; li++) {
        const lang = langs[li];
        try {
            const searchRes = await fetch(
                'https://' + lang + '.wikipedia.org/w/api.php?action=query&list=search&srsearch=' +
                encodeURIComponent(shortQuery) + '&format=json&origin=*&srlimit=2'
            );
            if (!searchRes.ok) continue;
            const searchData = await searchRes.json();
            const hits = searchData.query && searchData.query.search;
            if (!hits || hits.length === 0) continue;
            const title = hits[0].title;
            const summaryRes = await fetch(
                'https://' + lang + '.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title)
            );
            if (!summaryRes.ok) continue;
            const s = await summaryRes.json();
            if (s.extract && s.extract.length > 50) {
                const candidate = {
                    title: s.title,
                    extract: s.extract.slice(0, 1000),
                    source: lang === 'ko' ? '한국어 Wikipedia' : 'Wikipedia'
                };
                if (isWebResultRelevant(shortQuery, candidate)) return candidate;
            }
        } catch (e) { continue; }
    }
    return null;
}

async function findAndCreateBrand() {
    const desc = document.getElementById('brandDescInput').value.trim();
    if (!desc) { showToast('브랜드에 대해 설명해 주세요.'); return; }
    const provider = API_PROVIDERS[selectedProvider];
    const apiKey = localStorage.getItem(provider.storageKey) || '';
    if (!apiKey) { openApiKeyModal(); return; }
    const country = document.getElementById('brandCountryInput').value.trim();
    const generateBtn = document.getElementById('generateBtn');
    const shortQuery = extractSearchTerm(desc);

    const firstLine = desc.split('\n')[0].trim();
    const firstParts = firstLine.split(/[,;]/);
    const usedParts = (firstParts.length > 1 && firstParts[1].trim().length < 40) ? 2 : 1;
    const extraText = firstParts.slice(usedParts)
        .concat(desc.split('\n').slice(1))
        .map(function(s) { return s.trim(); })
        .filter(function(s) { return s.length > 0; })
        .join(' ');

    generateBtn.disabled = true;
    generateBtn.textContent = '찾는 중';
    document.getElementById('createNotFound').style.display = 'none';

    function setResult(brandData, fallbackName) {
        document.getElementById('pendingName').value = brandData.name || fallbackName;
        showGeneratedPreview(brandData);
    }
    try {
        if (extraText.length > 20) {
            generateBtn.textContent = '카드 생성 중';
            const userCtx = { title: shortQuery, extract: extraText, source: '사용자 입력' };
            const brandData = await generateBrandCard(provider, apiKey, shortQuery, country, userCtx);
            if (brandData && (brandData.name || brandData.description)) { setResult(brandData, shortQuery); return; }
        }
        if (localStorage.getItem(LS.keyBrave)) {
            generateBtn.textContent = 'Brave 검색 중';
            const braveResult = await searchBraveForBrand(shortQuery);
            if (braveResult) {
                generateBtn.textContent = '카드 생성 중';
                const brandData = await generateBrandCard(provider, apiKey, shortQuery, country, braveResult);
                if (brandData && (brandData.name || brandData.description)) { setResult(brandData, shortQuery); return; }
            }
        }
        generateBtn.textContent = 'AI 식별 중';
        let identified = await identifyBrand(provider, apiKey, shortQuery, country);
        if (!(identified.found && identified.confidence >= 60 && isRelevantMatch(shortQuery, identified.officialName))) {
            const latinOnly = extractLatinWords(shortQuery).join(' ');
            if (latinOnly && latinOnly !== shortQuery.toLowerCase().trim()) {
                const id2 = await identifyBrand(provider, apiKey, latinOnly, country);
                if (id2.found && id2.confidence >= 60 && isRelevantMatch(shortQuery, id2.officialName)) identified = id2;
            }
        }
        if (identified.found && identified.confidence >= 60 && isRelevantMatch(shortQuery, identified.officialName)) {
            if (identified.country && !country) document.getElementById('brandCountryInput').value = identified.country;
            generateBtn.textContent = '카드 생성 중';
            const brandData = await generateBrandCard(provider, apiKey, identified.officialName, identified.country || country, null);
            if (brandData) { setResult(brandData, identified.officialName); return; }
        }
        generateBtn.textContent = '웹 검색 중';
        const wikiResult = await searchWikipediaForBrand(shortQuery);
        if (wikiResult) {
            generateBtn.textContent = '카드 생성 중';
            const brandData = await generateBrandCard(provider, apiKey, shortQuery, country, wikiResult);
            if (brandData && (brandData.name || brandData.description)) { setResult(brandData, shortQuery); return; }
        }
        document.getElementById('createNotFound').style.display = 'block';
        generateBtn.disabled = false;
        generateBtn.textContent = '다시 찾기';
    } catch (err) {
        showToast('오류: ' + err.message);
        generateBtn.disabled = false;
        generateBtn.textContent = '다시 찾기';
    }
}

async function verifyUrlReachable(url) {
    if (!url) return { ok: true };
    if (!/^https?:\/\//i.test(url)) return { ok: false };
    try {
        await fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
        return { ok: true };
    } catch (e1) {
        try {
            await fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' });
            return { ok: true };
        } catch (e2) { return { ok: false }; }
    }
}

async function pushToGitHub(pat) {
    const owner = REPO.owner;
    const repo = REPO.name;
    const headers = {
        'Authorization': 'Bearer ' + pat,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
    };
    function toB64(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        bytes.forEach(function(b) { bin += String.fromCharCode(b); });
        return btoa(bin);
    }
    async function putFile(path, content, commitMsg, sha) {
        const body = { message: commitMsg, content: toB64(content) };
        if (sha === undefined) {
            const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, { headers: headers });
            sha = getRes.ok ? (await getRes.json()).sha : null;
        }
        if (sha) body.sha = sha;
        const res = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
            method: 'PUT', headers: headers, body: JSON.stringify(body)
        });
        if (!res.ok) {
            const err = await res.json().catch(function() { return {}; });
            throw new Error(path + ' 쓰기 실패: ' + (err.message || res.status));
        }
    }

    // 1. 현재 brands.json 읽기
    const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/brands.json', { headers: headers });
    if (!getRes.ok) throw new Error('brands.json 읽기 실패: ' + getRes.status);
    const fileData = await getRes.json();
    const raw = new TextDecoder().decode(
        Uint8Array.from(atob(fileData.content.replace(/\n/g, '')), function(c) { return c.charCodeAt(0); })
    );
    const doc = JSON.parse(raw);
    if (!Array.isArray(doc.brands)) throw new Error('brands.json 스키마가 예상과 다릅니다 (brands 배열 없음).');

    // 2. overrides 적용
    Object.keys(brandOverrides).forEach(function(origName) {
        const idx = doc.brands.findIndex(function(b) { return b.name === origName; });
        if (idx >= 0) doc.brands[idx] = Object.assign({}, doc.brands[idx], brandOverrides[origName]);
    });
    // 3. 숨김(삭제 표시) 반영: 데이터 유실 방지를 위해 hidden 플래그만 부여
    hiddenBrands.forEach(function(name) {
        const idx = doc.brands.findIndex(function(b) { return b.name === name; });
        if (idx >= 0) doc.brands[idx].hidden = true;
    });
    // 4. 커스텀 브랜드 추가
    customBrands.forEach(function(brand) {
        const exists = doc.brands.some(function(b) { return b.name === brand.name; });
        if (!exists) doc.brands.push(brand);
    });
    doc.updatedAt = new Date().toISOString().split('T')[0];

    await putFile('brands.json', JSON.stringify(doc, null, 2),
        '브랜드 편집 반영 (수정 ' + Object.keys(brandOverrides).length + '건, 신규 ' + customBrands.length + '건)', fileData.sha);

    // 5. 백업 파일: overrides 비움, customBrands는 배포 지연 안전망으로 유지
    await putFile('brands_backup.json', JSON.stringify({
        savedAt: new Date().toISOString(),
        overrides: {},
        customBrands: customBrands
    }, null, 2), '백업 - overrides 반영 완료, customBrands 안전망 유지');

    await putFile('favorites_backup.json', JSON.stringify({
        savedAt: new Date().toISOString(),
        favorites: favorites
    }, null, 2), 'Favorites 백업');

    brandOverrides = {};
    saveBrandOverrides();
    hiddenBrands = new Set();
    saveHiddenBrands();
}

    // 칩이 카드/히어로 내부에 있으므로 data-nav보다 먼저 처리
    const chip = e.target.closest('.chip[data-brand]');
    if (chip) { e.preventDefault(); e.stopPropagation(); goToBrand(chip.dataset.brand); return; }

    const navEl = e.target.closest('[data-nav]');
    if (navEl) {
        e.preventDefault();
        toggleFabMenu(false);
        const nav = navEl.dataset.nav;
        if (nav === 'category') showView('category', navEl.dataset.cat);
        else showView(nav);
        return;
    }

    const azItem = e.target.closest('.az-item[data-name]');
    if (azItem) { goToBrand(azItem.dataset.name); return; }

    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const itemName = (actionEl.closest('.brand-item') || {}).dataset ? actionEl.closest('.brand-item').dataset.name : null;

    switch (action) {
        case 'fav': if (itemName) toggleFavorite(itemName); break;
        case 'share-fav': shareFavorites(); break;
        case 'report': openReportModal(); break;
        case 'submit-report': submitReport(); break;
        case 'close-modal': actionEl.closest('.modal-overlay').classList.remove('active'); break;
        /* -- admin -- */
        case 'edit': if (isAdmin && itemName) openEditModal(itemName); break;
        case 'open-create': if (isAdmin) openCreateModal(); break;
        case 'close-create': closeCreateModal(); break;
        case 'find-brand': findAndCreateBrand(); break;
        case 'manual-entry': showManualEntry(); break;
        case 'save-created': saveGeneratedBrand(); break;
        case 'open-apikey': if (isAdmin) openApiKeyModal(); break;
        case 'close-apikey': modal('apiKeyModal', false); break;
        case 'save-apikey': saveApiKey(); break;
        case 'save-bravekey': saveBraveKey(); break;
        case 'open-push': if (isAdmin) openPushModal(); break;
        case 'close-push': modal('pushModal', false); break;
        case 'push-confirm': pushConfirm(); break;
        case 'close-edit': modal('editModal', false); currentEditingBrandName = null; break;
        case 'save-edit': saveEditedBrand(); break;
        case 'delete-brand': deleteEditedBrand(); break;
        case 'regen-desc': regenerateDescription(actionEl); break;
        case 'find-links': findLinksAI(actionEl); break;
        case 'verify-links': verifyEditLinks(actionEl); break;
        case 'admin-off':
            localStorage.removeItem(LS.admin);
            location.href = location.pathname;
            break;
    }
    const provOpt = e.target.closest('.provider-opt');
    if (provOpt) { selectedProvider = provOpt.dataset.provider; refreshProviderUI(); }
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const azItem = e.target.closest ? e.target.closest('.az-item[data-name]') : null;
        if (azItem) goToBrand(azItem.dataset.name);
    }
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(function(m) { m.classList.remove('active'); });
    }
});

/* === 부팅 ===================================================== */
function applySiteMeta() {
    document.title = SITE.product;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', SITE.metaDescription);
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute('content', SITE.product);
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.setAttribute('content', SITE.metaDescription);
}
function adaptLegacyData(json) {
    // 구 스키마(카테고리 키 객체) 호환: tags로 보존하며 평탄화
    const OLD_TO_NEW_TAG = OLD_CATEGORY_LABELS;
    const out = [];
    Object.keys(json).forEach(function(cat) {
        if (!Array.isArray(json[cat])) return;
        json[cat].forEach(function(b) {
            const r = Object.assign({}, b);
            r.tags = Array.isArray(r.tags) ? r.tags : [];
            if (OLD_TO_NEW_TAG[cat] && r.tags.indexOf(OLD_TO_NEW_TAG[cat]) < 0) r.tags.push(OLD_TO_NEW_TAG[cat]);
            r.category = 'unclassified';
            if (!r.addedAt) r.addedAt = 'unknown';
            out.push(r);
        });
    });
    return out;
}
window.addEventListener('DOMContentLoaded', function() {
    applySiteMeta();
    if (isAdmin) injectAdminUI();

    document.getElementById('azSearch').addEventListener('input', function(e) {
        renderAZ(e.target.value);
    });

    fetch('brands.json')
        .then(function(res) { return res.json(); })
        .then(function(json) {
            mainBrands = Array.isArray(json.brands) ? json.brands : adaptLegacyData(json);
            mainBrands = mainBrands.filter(function(b) { return !b.hidden; });
            return fetch('brands_backup.json?_=' + Date.now())
                .then(function(r) { return r.ok ? r.json() : null; })
                .catch(function() { return null; });
        })
        .then(function(backup) {
            if (backup) {
                Object.assign(brandOverrides, backup.overrides || {});
                (backup.customBrands || []).forEach(function(sb) {
                    const nb = normalizeCustomBrand(sb);
                    const idx = customBrands.findIndex(function(lb) { return lb.id === nb.id || lb.name === nb.name; });
                    if (idx >= 0) customBrands[idx] = Object.assign({}, customBrands[idx], nb);
                    else customBrands.push(nb);
                });
                saveCustomBrands();
            }
            return fetch('favorites_backup.json?_=' + Date.now())
                .then(function(r) { return r.ok ? r.json() : null; })
                .catch(function() { return null; });
        })
        .then(function(favBackup) {
            if (favBackup && Array.isArray(favBackup.favorites)) {
                favBackup.favorites.forEach(function(f) {
                    if (favorites.indexOf(f) < 0) favorites.push(f);
                });
                saveFavorites();
            }
        })
        .catch(function(err) { console.error('brands.json 로드 실패:', err); })
        .then(function() { renderFabMenu(); showView('index'); });
});
</script>
